<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-label="Prévia do terminal interativo v3ll0wn, preto e vermelho, com comandos de projetos e segurança">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151118"/><stop offset="0.6" stop-color="#09090d"/><stop offset="1" stop-color="#200b17"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f93b68"/><stop offset="1" stop-color="#9e1b46"/></linearGradient>
