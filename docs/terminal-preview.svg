 <style>
 text{font-family:Consolas,'Courier New',monospace}
 .soft{fill:#a8a2b1}.white{fill:#f0e9ed}.red{fill:#ff4a75}.green{fill:#56e7a8}
 .cursor{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}
 @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
 </style>
</defs>
